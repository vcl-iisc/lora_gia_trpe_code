name: single_image_small

defaults:
  - data: CIFAR10
  - impl: default
  - server: honest-but-curious
  - user: local_gradient
  - _self_

model: 
  name: vit_small # choices: vit_base, vit_smal, vit_custom 
  # [embed_layer, embed_dim, num_heads, depth should be set in case of vit_custom]
  # [also provide pretrained path if cifar pretrained weights are available]
  # [for others, pretrained can be set to true or pretrained path can be provided]
  # embed_layer: linear
  # embed_dim: 384
  # num_heads: 12
  # depth: 7
  # mlp_ratio: 1
  patch_size: 16

server:
  pretrained: false
  pretrained_path: null #./breaching/pretrained/CIFAR10/vit_small/convpatch/ps16/best.ckpt

# model: vit_small # Will also work


# Optional ViT PEFT configuration.
peft:
  enabled: true
  type: lora  # choices: vpt, lora
  lora:
    rank: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q, k, v] # choices q, k, v, mlp
    pop_index: 0 # 0 for lora, 2 for vpt (after the first two blocks of the transformer)
    initialisation: standard # choices: normal, uniform, standard, lora_one
    # [The below fields are for LoRA-One initialization, and are ignored if initialisation is not set to lora_one]
    gamma: 128
    probe_batch_size: 8
    probe_user_offset: 1

user:
  provide_labels: True
  num_data_points: 1

# Server and user:
num_queries: 1
num_users: 10