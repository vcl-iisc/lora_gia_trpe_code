defaults:
  - _default_optimization_attack
  - _self_
type: optimization
# attack_type: april-optimization

objective:
  type: euclidean-grad-cossim-posembed
  scale: 0.0001 # need to have a much smaller scale like 0.0001 for euclidean objectives
  posembed_scale: 0.01
  posembed_trainable: True # This belongs to attack strategies, hence should be defined here.
  apply_block_pos_embed: False
  weight_start: 1.0
  weight_end: 1.0

restarts:
  num_trials: 1
  scoring: "euclidean"

optim:
  optimizer: adam
  signed:
  step_size: 0.1
  boxed: False
  max_iterations: 1500
  step_size_decay: step-lr

  callback: 100 # Print objective value every callback many iterations

augmentations:

differentiable_augmentations: False

regularization:
  total_variation:
    scale: 0.001