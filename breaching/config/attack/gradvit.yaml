defaults:
  - _default_optimization_attack
  - _self_
type: gradvit
label_strategy: bias-corrected

objective:
  type: cosine-similarity
  scale: 0.004 # need to have a much smaller scale like 0.0001 for euclidean objectives
  max_iterations: 20_000
  posembed_scale: 0.1
  task_regularization: 0.0
  posembed_trainable: False # This belongs to attack strategies, hence should be defined here.
  apply_block_pos_embed: False
  weight_start: 1.0
  weight_end: 1.0


restarts:
  num_trials: 3
  scoring: "cosine-similarity"

optim:
  optimizer: adam
  signed:
  step_size: 0.1
  boxed: False
  max_iterations: 20_000
  step_size_decay: cosine-decay

  callback: 1000 # Print objective value every callback many iterations

regularization:
  image_prior:
    scale: 0.2
    max_iters: 20_000
    first_bn_multiplier: 1.0
  patch_prior:
    scale: 0.0001
    patch_size: 16
  total_variation:
    scale: 0.0001
    inner_exp: 1
    outer_exp: 1
    # double_opponents: True
  l2_regularization: # For parameter scaling
    scale: 0.0001
  group_lazy_regularization:
    parallel: True
    scale: 0.01
    warmup_iters: 2000
    


